name: CI/CD Pyrenex Prod

on:
  push:
    # Déclenche aussi la CI sur la branche de livraison individuelle M5-B2.
    branches: [main, m5-b2-franck]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model deps
        run: pip install -r services/model/requirements.txt pytest httpx
      - name: Tests unitaires + contract test du modèle
        run: pytest -v services/model/tests
      - name: Tests de l'évaluation continue
        run: pytest -v tests/test_evaluate_model.py
      - name: Install backend deps
        run: pip install -r services/backend/requirements.txt pytest httpx
      - name: Tests unitaires backend
        run: pytest -v services/backend/tests

  evaluate-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: pip install -r requirements-dev.txt
      - name: Evaluate model against golden baseline
        run: python scripts/evaluate_model.py --release-tag "${{ github.head_ref || github.ref_name }}"
      - name: Upload MLflow runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-${{ github.run_id }}
          path: mlruns/
          if-no-files-found: error

  build-and-push:
    needs: [test, evaluate-model]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build model image
        run: |
          IMG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-model"
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build -t "$IMG:$TAG" ./services/model
          docker push "$IMG:$TAG"

name: CI/CD Pyrenex Prod

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model deps
        run: pip install -r services/model/requirements.txt pytest httpx
      - name: Tests unitaires + contract test du modèle
        run: pytest -v services/model/tests
      - name: Install backend deps
        run: pip install -r services/backend/requirements.txt pytest httpx
      - name: Tests unitaires backend
        run: pytest -v services/backend/tests

  # TODO 1 (M5-B2) — job `evaluate-model` :
  #   needs: test ; lance `python scripts/evaluate_model.py --release-tag <ref>`
  #   qui DOIT bloquer (exit≠0) si une métrique passe sous les seuils.
  #   Uploadez mlruns/ en artefact.

  build-and-push:
    needs: test # needs: [test, evaluate-model] après le TODO 1
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build model image
        run: |
          IMG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-model"
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build -t "$IMG:$TAG" ./services/model
          docker push "$IMG:$TAG"

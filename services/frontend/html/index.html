<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyrenex Crédit — Scoring risque</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
  <div class="page-tools">
    <button type="button" id="colorBlindToggle" class="palette-toggle" aria-pressed="false">
      <span aria-hidden="true">◐</span>
      <span class="palette-toggle-label">Activer les couleurs accessibles</span>
    </button>
  </div>
  <p class="eyebrow">Pyrenex Crédit</p>
  <h1>Évaluation du risque de défaut</h1>
  <p class="intro">Renseignez les caractéristiques du dossier pour obtenir une estimation instantanée du risque de crédit.</p>
  <div class="workspace">
  <section class="card form-card">
  <form id="scoreForm">
    <label for="loan_amnt">Montant du prêt ($)</label>
    <input id="loan_amnt" name="loan_amnt" type="number" min="500" max="40000" step="100" required>

    <label for="int_rate">Taux d'intérêt (%)</label>
    <input id="int_rate" name="int_rate" type="number" min="0" max="50" step="0.01" required>

    <label for="installment">Mensualité ($)</label>
    <input id="installment" name="installment" type="number" min="0" max="2000" step="0.01" required>

    <label for="annual_inc">Revenu annuel ($)</label>
    <input id="annual_inc" name="annual_inc" type="number" min="0" max="10000000" step="100" required>

    <label for="dti">Ratio d'endettement (DTI)</label>
    <input id="dti" name="dti" type="number" min="0" max="200" step="0.01" required>

    <label for="delinq_2yrs">Incidents de paiement (2 dernières années)</label>
    <input id="delinq_2yrs" name="delinq_2yrs" type="number" min="0" max="50" step="1" required>

    <label for="fico_range_low">Score FICO (borne basse)</label>
    <input id="fico_range_low" name="fico_range_low" type="number" min="300" max="850" step="1" required>

    <label for="revol_util">Utilisation du crédit renouvelable (%)</label>
    <input id="revol_util" name="revol_util" type="number" min="0" max="300" step="0.01" required>

    <label for="term">Durée du prêt</label>
    <select id="term" name="term" required>
      <option value="36 months">36 mois</option>
      <option value="60 months">60 mois</option>
    </select>

    <label for="grade">Note (grade)</label>
    <select id="grade" name="grade" required>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
    </select>

    <label for="home_ownership">Statut d'occupation</label>
    <select id="home_ownership" name="home_ownership" required>
      <option value="RENT">RENT</option>
      <option value="OWN">OWN</option>
      <option value="MORTGAGE">MORTGAGE</option>
      <option value="OTHER">OTHER</option>
      <option value="NONE">NONE</option>
      <option value="ANY">ANY</option>
    </select>

    <label for="verification_status">Statut de vérification</label>
    <select id="verification_status" name="verification_status" required>
      <option value="Verified">Verified</option>
      <option value="Source Verified">Source Verified</option>
      <option value="Not Verified">Not Verified</option>
    </select>

    <label for="purpose">Objet du prêt</label>
    <select id="purpose" name="purpose" required>
      <option value="debt_consolidation">debt_consolidation</option>
      <option value="credit_card">credit_card</option>
      <option value="home_improvement">home_improvement</option>
      <option value="major_purchase">major_purchase</option>
      <option value="small_business">small_business</option>
      <option value="other">other</option>
      <option value="medical">medical</option>
      <option value="moving">moving</option>
      <option value="vacation">vacation</option>
      <option value="house">house</option>
      <option value="renewable_energy">renewable_energy</option>
      <option value="educational">educational</option>
      <option value="car">car</option>
      <option value="wedding">wedding</option>
    </select>

    <label for="emp_length">Ancienneté professionnelle</label>
    <select id="emp_length" name="emp_length" required>
      <option value="< 1 year">&lt; 1 year</option>
      <option value="1 year">1 year</option>
      <option value="2 years">2 years</option>
      <option value="3 years">3 years</option>
      <option value="4 years">4 years</option>
      <option value="5 years">5 years</option>
      <option value="6 years">6 years</option>
      <option value="7 years">7 years</option>
      <option value="8 years">8 years</option>
      <option value="9 years">9 years</option>
      <option value="10+ years">10+ years</option>
    </select>

    <div class="actions">
      <button type="button" id="randomData" class="secondary">↻ Données au hasard</button>
      <button type="submit">Évaluer le risque</button>
    </div>
  </form>
  </section>
  <aside id="result" class="result-card" role="status" aria-live="polite"></aside>
  </div>
  </main>

  <script>
    const form = document.getElementById('scoreForm');
    const result = document.getElementById('result');
    const randomDataButton = document.getElementById('randomData');
    const colorBlindToggle = document.getElementById('colorBlindToggle');
    const numericFields = ['loan_amnt','int_rate','installment','annual_inc','dti','delinq_2yrs','fico_range_low','revol_util'];

    const setColorBlindPalette = (enabled) => {
      document.documentElement.classList.toggle('color-blind', enabled);
      colorBlindToggle.setAttribute('aria-pressed', String(enabled));
      colorBlindToggle.querySelector('.palette-toggle-label').textContent = enabled
        ? 'Revenir aux couleurs standard'
        : 'Activer les couleurs accessibles';
    };

    let colorBlindEnabled = false;
    try {
      colorBlindEnabled = localStorage.getItem('colorBlindPalette') === 'true';
    } catch (_) {
      // La palette reste utilisable lorsque le stockage du navigateur est bloqué.
    }
    setColorBlindPalette(colorBlindEnabled);

    colorBlindToggle.addEventListener('click', () => {
      colorBlindEnabled = !document.documentElement.classList.contains('color-blind');
      setColorBlindPalette(colorBlindEnabled);
      try {
        localStorage.setItem('colorBlindPalette', String(colorBlindEnabled));
      } catch (_) {
        // Le choix s'applique à la session même sans stockage persistant.
      }
    });

    // Lignes complètes de data/reference_set_TEMPLATE.csv (loan_status exclu).
    const referenceColumns = ['loan_amnt','term','int_rate','installment','grade','emp_length','home_ownership','annual_inc','verification_status','purpose','dti','delinq_2yrs','fico_range_low','revol_util'];
    const referenceRows = [
      [18900,'36 months',12.51,632.36,'C','10+ years','MORTGAGE',26900,'Verified','small_business',13.12,0,707,69.5],
      [5300,'60 months',17.01,131.75,'D','1 year','RENT',46900,'Not Verified','debt_consolidation',30.52,0,693,27.4],
      [6500,'60 months',19.64,170.91,'D','10+ years','MORTGAGE',63000,'Not Verified','home_improvement',11.66,1,700,67.7],
      [6300,'36 months',23.63,245.94,'F','10+ years','MORTGAGE',88500,'Source Verified','medical',8.86,0,661,58.7],
      [21700,'36 months',18.99,795.33,'E','10+ years','RENT',99100,'Not Verified','debt_consolidation',26.68,1,656,54.9],
      [15800,'60 months',21.25,429.67,'E','1 year','RENT',72100,'Not Verified','debt_consolidation',6.91,0,665,12.9],
      [6100,'60 months',14.93,144.89,'C','4 years','MORTGAGE',67200,'Source Verified','debt_consolidation',20.94,0,686,56.7],
      [14200,'36 months',11.11,465.63,'B','3 years','MORTGAGE',67100,'Not Verified','credit_card',11.82,0,713,59.3],
      [9900,'36 months',11.89,328.3,'C','3 years','OWN',165700,'Not Verified','debt_consolidation',35.65,0,676,62.6],
      [22500,'60 months',12.89,510.68,'C','10+ years','RENT',88500,'Source Verified','small_business',14.51,1,703,15],
      [19500,'36 months',15.32,679.03,'C','2 years','RENT',70100,'Not Verified','debt_consolidation',20.22,0,702,67.1],
      [7800,'36 months',14.19,267.31,'C','7 years','MORTGAGE',77500,'Verified','debt_consolidation',24.8,1,700,42.6],
      [8000,'36 months',12.24,266.63,'C','4 years','MORTGAGE',22300,'Not Verified','small_business',10.38,0,687,64],
      [15500,'60 months',15.42,372.17,'D','3 years','RENT',17200,'Not Verified','other',21.58,1,689,72.9],
      [5300,'36 months',7.99,166.06,'A','5 years','RENT',35200,'Not Verified','credit_card',20.94,2,740,64.6],
      [13600,'60 months',11.84,301.43,'B','10+ years','MORTGAGE',51400,'Source Verified','other',20.07,0,691,78.1],
      [22600,'36 months',21.05,852.04,'E','1 year','RENT',15800,'Source Verified','debt_consolidation',14.69,0,662,48],
      [7100,'36 months',18.48,258.39,'D','10+ years','MORTGAGE',63400,'Source Verified','major_purchase',21.12,0,684,58.2],
      [13900,'60 months',16.19,339.43,'D','3 years','MORTGAGE',80000,'Verified','credit_card',5.17,1,684,61.4],
    ];

    // Regroupe chaque libellé et son champ pour la grille responsive.
    form.querySelectorAll(':scope > label').forEach((label) => {
      const field = label.nextElementSibling;
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      form.insertBefore(wrapper, label);
      wrapper.append(label, field);
    });

    randomDataButton.addEventListener('click', () => {
      const row = referenceRows[Math.floor(Math.random() * referenceRows.length)];
      referenceColumns.forEach((column, index) => {
        form.elements[column].value = row[index];
      });
      result.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {};
      for (const [key, value] of fd.entries()) {
        payload[key] = numericFields.includes(key) ? Number(value) : value;
      }
      result.classList.remove('ok', 'ko');
      result.style.display = 'block';
      result.textContent = 'Évaluation en cours…';
      try {
        const res = await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Erreur ${res.status}`);
        }
        const data = await res.json();
        const isDefault = data.prediction === 1;
        result.classList.add(isDefault ? 'ko' : 'ok');
        const pct = (data.probability * 100).toFixed(1);
        const decision = isDefault ? 'Risque de défaut' : 'Prêt remboursé';
        result.innerHTML = `
          <span class="result-label">Décision du modèle</span>
          <strong>${decision}</strong>
          <span class="probability">${pct}%</span>
          <span class="probability-label">Probabilité de défaut</span>
          <span class="result-meta">Modèle ${data.model_version}<br>Requête <code>${data.request_id}</code></span>
        `;
      } catch (err) {
        result.classList.add('ko');
        result.textContent = `Erreur : ${err.message}`;
      }
    });
  </script>
</body>
</html>

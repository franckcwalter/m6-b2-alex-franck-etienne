<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyrenex Crédit — Scoring risque</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .4rem 0 .1rem; font-size: .9rem; }
    input, select { width: 100%; padding: .4rem; box-sizing: border-box; }
    button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
    .ok { background: #e6f4ea; } .ko { background: #fce8e6; }
  </style>
</head>
<body>
  <h1>Pyrenex Crédit — Évaluation du risque de défaut</h1>
  <form id="scoreForm">
    <label for="loan_amnt">Montant du prêt ($)</label>
    <input id="loan_amnt" name="loan_amnt" type="number" min="500" max="40000" step="100" required>

    <label for="int_rate">Taux d'intérêt (%)</label>
    <input id="int_rate" name="int_rate" type="number" min="0" max="50" step="0.01" required>

    <label for="installment">Mensualité ($)</label>
    <input id="installment" name="installment" type="number" min="0" max="2000" step="0.01" required>

    <label for="annual_inc">Revenu annuel ($)</label>
    <input id="annual_inc" name="annual_inc" type="number" min="0" max="10000000" step="100" required>

    <label for="dti">Ratio d'endettement (DTI)</label>
    <input id="dti" name="dti" type="number" min="0" max="200" step="0.01" required>

    <label for="delinq_2yrs">Incidents de paiement (2 dernières années)</label>
    <input id="delinq_2yrs" name="delinq_2yrs" type="number" min="0" max="50" step="1" required>

    <label for="fico_range_low">Score FICO (borne basse)</label>
    <input id="fico_range_low" name="fico_range_low" type="number" min="300" max="850" step="1" required>

    <label for="revol_util">Utilisation du crédit renouvelable (%)</label>
    <input id="revol_util" name="revol_util" type="number" min="0" max="300" step="0.01" required>

    <label for="term">Durée du prêt</label>
    <select id="term" name="term" required>
      <option value="36 months">36 mois</option>
      <option value="60 months">60 mois</option>
    </select>

    <label for="grade">Note (grade)</label>
    <select id="grade" name="grade" required>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
    </select>

    <label for="home_ownership">Statut d'occupation</label>
    <select id="home_ownership" name="home_ownership" required>
      <option value="RENT">RENT</option>
      <option value="OWN">OWN</option>
      <option value="MORTGAGE">MORTGAGE</option>
      <option value="OTHER">OTHER</option>
      <option value="NONE">NONE</option>
      <option value="ANY">ANY</option>
    </select>

    <label for="verification_status">Statut de vérification</label>
    <select id="verification_status" name="verification_status" required>
      <option value="Verified">Verified</option>
      <option value="Source Verified">Source Verified</option>
      <option value="Not Verified">Not Verified</option>
    </select>

    <label for="purpose">Objet du prêt</label>
    <select id="purpose" name="purpose" required>
      <option value="debt_consolidation">debt_consolidation</option>
      <option value="credit_card">credit_card</option>
      <option value="home_improvement">home_improvement</option>
      <option value="major_purchase">major_purchase</option>
      <option value="small_business">small_business</option>
      <option value="other">other</option>
      <option value="medical">medical</option>
      <option value="moving">moving</option>
      <option value="vacation">vacation</option>
      <option value="house">house</option>
      <option value="renewable_energy">renewable_energy</option>
      <option value="educational">educational</option>
      <option value="car">car</option>
      <option value="wedding">wedding</option>
    </select>

    <label for="emp_length">Ancienneté professionnelle</label>
    <select id="emp_length" name="emp_length" required>
      <option value="< 1 year">&lt; 1 year</option>
      <option value="1 year">1 year</option>
      <option value="2 years">2 years</option>
      <option value="3 years">3 years</option>
      <option value="4 years">4 years</option>
      <option value="5 years">5 years</option>
      <option value="6 years">6 years</option>
      <option value="7 years">7 years</option>
      <option value="8 years">8 years</option>
      <option value="9 years">9 years</option>
      <option value="10+ years">10+ years</option>
    </select>

    <button type="submit">Évaluer le risque</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('scoreForm');
    const result = document.getElementById('result');
    const numericFields = ['loan_amnt','int_rate','installment','annual_inc','dti','delinq_2yrs','fico_range_low','revol_util'];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {};
      for (const [key, value] of fd.entries()) {
        payload[key] = numericFields.includes(key) ? Number(value) : value;
      }
      result.className = '';
      result.style.display = 'block';
      result.textContent = 'Évaluation en cours…';
      try {
        const res = await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Erreur ${res.status}`);
        }
        const data = await res.json();
        const isDefault = data.prediction === 1;
        result.className = isDefault ? 'ko' : 'ok';
        const pct = (data.probability * 100).toFixed(1);
        result.innerHTML = isDefault
          ? `<strong>Risque de défaut</strong> — probabilité ${pct}%<br>Modèle ${data.model_version} · requête ${data.request_id}`
          : `<strong>Prêt remboursé</strong> — probabilité de défaut ${pct}%<br>Modèle ${data.model_version} · requête ${data.request_id}`;
      } catch (err) {
        result.className = 'ko';
        result.textContent = `Erreur : ${err.message}`;
      }
    });
  </script>
</body>
</html>
